name: Chronos integrity

on:
  pull_request:
    branches:
      - chronos/base-a581

permissions:
  contents: read

jobs:
  recurrence-guard:
    name: recurrence guard
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
      - name: Evaluate installed Chronos policy
        run: python .github/chronos_integrity_guard.py
